services:
  postgres:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-artist_activity}
      POSTGRES_USER: ${POSTGRES_USER:-artist_activity}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-artist_activity}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Applied once, automatically, on first container init only -- if
      # you change the schema, either drop the volume or apply the new
      # SQL by hand (see README).
      - ./sql:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-artist_activity} -d ${POSTGRES_DB:-artist_activity}"]
      interval: 5s
      timeout: 5s
      retries: 10

  python:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-artist_activity}
      POSTGRES_USER: ${POSTGRES_USER:-artist_activity}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-artist_activity}
      TICKETMASTER_API_KEY: ${TICKETMASTER_API_KEY}
      MUSICBRAINZ_USER_AGENT: ${MUSICBRAINZ_USER_AGENT}
    volumes:
      - ./scripts:/app/scripts
      - ./seed:/app/seed
      - ./output:/app/output
    # No command by default -- run scripts on demand, e.g.:
    #   docker-compose run --rm python python ingest_musicbrainz.py
    tty: true

volumes:
  pgdata:
